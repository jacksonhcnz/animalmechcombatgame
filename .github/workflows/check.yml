name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
      - name: Load project headlessly
        run: GODOT="$RUNNER_TEMP/godot" tools/check.sh
